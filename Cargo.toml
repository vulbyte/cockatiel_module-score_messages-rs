[package]
name = "score_messages_rs"
version = "0.1.0"
edition = "2021"

[dependencies]
cockatiel-client = { git = "https://github.com/vulbyte/cockatiel_client-rs", rev = "d8018510768ce09d1dcd61a1770b7356299af261" }
tokio = { version = "1.38", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
prost = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v7"] }

# The tuning probe (src/bin/score_probe.rs) is an offline dev tool, not part of
# the shipped module — gated behind the `probe` feature so `cargo build
# --release` (what the supervisor runs) never pulls plotters into the module.
plotters = { version = "0.3", optional = true, features = ["svg_backend"] }

[features]
probe = ["dep:plotters"]

[[bin]]
name = "score_probe"
path = "src/bin/score_probe.rs"
required-features = ["probe"]